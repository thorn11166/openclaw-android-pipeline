## Troubleshooting

### "Gradle sync failed"
- Check `build.gradle.kts` for typos and dependency versions
- Run `./gradlew --refresh-dependencies` locally

### "SDK not found"
- Ensure Android SDK is installed via setup-android@v2
- Check API level matches `api-levels` in workflow

### "Build times out"
- Increase `timeout-minutes` in job config
- Enable Gradle build cache
- Reduce parallel tasks with `org.gradle.workers.max=2`

### "Out of memory"
- Increase heap with `GRADLE_OPTS: "-Xmx6144m"`
- Use `--parallel` flag to enable parallelization

### "Artifact not found"
- Check build variant name matches path in artifact upload
- Ensure build completes without errors first

---

## CI/CD Best Practices

1. **Cache Gradle dependencies** - Reduces build time significantly
2. **Run tests early** - Catch bugs before building APK
3. **Use build variants** - Debug/release builds have different configs
4. **Fail fast** - Run lint and unit tests before building APK
5. **Archive artifacts** - Keep 30-day history for debugging
6. **Matrix builds** - Test on multiple API levels (optional)

```yaml
strategy:
  matrix:
    api-level: [ 28, 30, 32, 34 ]
```
